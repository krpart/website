# Pages CMS settings: this file decides the form Krina sees at app.pagescms.org.
# Fields are in the same order as the page. Each "name" must match a key in content.json.

media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
  - name: files
    label: Files (PDFs)
    input: files
    output: /files
    categories: [document]

content:
  - name: website
    label: Website
    type: file
    path: content.json
    format: json
    fields:

      # ---------- Top of the page ----------
      - name: header
        label: Top of the page
        type: object
        fields:
          - name: name
            label: Your name
            type: string
            required: true
            description: Shown large at the top of the page.
          - name: tagline
            label: Line under your name
            type: string
            description: For example "Artist and Researcher · Ed.D., Harvard University".

      # ---------- Opening artwork ----------
      - name: opening
        label: Opening artwork
        type: object
        fields:
          - name: show
            label: Show the opening artwork
            type: boolean
          - name: image
            label: Image
            type: image
            options:
              media: images
            description: The large picture at the top of the page.
          - name: image_small
            label: Phone-size copy of the image (optional)
            type: image
            options:
              media: images
            description: A smaller copy for phones, 800 pixels on the long side. Leave empty if you don't have one.
          - name: width
            label: Image width in pixels
            type: number
            description: Stops the page jumping while it loads. Danny fills this in; leave empty for a new image.
          - name: height
            label: Image height in pixels
            type: number
            description: Danny fills this in; leave empty for a new image.
          - name: alt
            label: Description for blind visitors
            type: text
            description: One or two sentences saying what the picture shows. Read aloud by screen readers.
          - name: title
            label: Artwork title
            type: string
            description: Shown in italics under the picture.
          - name: detail
            label: After the title
            type: string
            description: For example "ongoing" or "2010".

      # ---------- Statement ----------
      - name: statement
        label: Statement (the italic paragraph)
        type: object
        fields:
          - name: show
            label: Show the statement
            type: boolean
          - name: text
            label: Statement
            type: text
            description: Your first-person statement, shown large in italics. About 60 words.

      # ---------- About ----------
      - name: about
        label: About
        type: object
        fields:
          - name: show
            label: Show About
            type: boolean
          - name: heading
            label: Heading
            type: string
            description: Also used as the menu link at the top of the page.
          - name: paragraphs
            label: Short bio
            type: text
            list: true
            description: One box per paragraph. About 280 words in all.
          - name: links
            label: Linked words
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            description: Words in the bio that should become links.
            fields:
              - name: text
                label: Words (exactly as they appear in the bio)
                type: string
              - name: url
                label: Web address
                type: string
                description: Leave empty to show the words without a link.
          - name: italics
            label: Words in italics
            type: string
            list: true
            description: Book titles and other words to show in italics, written exactly as in the bio.
          - name: portrait
            label: Portrait
            type: object
            fields:
              - name: show
                label: Show your portrait
                type: boolean
              - name: image
                label: Portrait photo
                type: image
                options:
                  media: images
              - name: width
                label: Photo width in pixels
                type: number
                description: Optional. Stops the page jumping while it loads.
              - name: height
                label: Photo height in pixels
                type: number
                description: Optional.
              - name: alt
                label: Description for blind visitors
                type: text
                description: For example "Krina Patel in her studio at Fort Point Open Studios".
              - name: caption
                label: Photo credit or caption
                type: string
                description: Optional. Shown small under the photo.
          - name: cv
            label: CV download
            type: object
            fields:
              - name: show
                label: Show the CV button
                type: boolean
              - name: label
                label: Button text
                type: string
              - name: file
                label: CV (PDF file)
                type: file
                options:
                  media: files

      # ---------- Studio ----------
      - name: studio
        label: Studio
        type: object
        fields:
          - name: show
            label: Show Studio
            type: boolean
          - name: heading
            label: Heading
            type: string
            description: Also used as the menu link at the top of the page.
          - name: paragraphs
            label: Studio statement
            type: text
            list: true
            description: One box per paragraph.
          - name: artworks
            label: Artworks
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}, {year}"
            description: Drag to change the order on the page.
            fields:
              - name: title
                label: Title
                type: string
                description: Shown in italics.
              - name: year
                label: Year
                type: string
              - name: medium
                label: Medium
                type: string
                description: For example "Etching with chine-collé".
              - name: size
                label: Size
                type: string
                description: For example "15 × 12 in". Leave empty if it doesn't apply.
              - name: image
                label: Image
                type: image
                options:
                  media: images
                description: About 1600 pixels on the long side (see the README for how to shrink a photo).
              - name: image_small
                label: Phone-size copy (optional)
                type: image
                options:
                  media: images
                description: 800 pixels on the long side. Leave empty if you don't have one.
              - name: width
                label: Image width in pixels
                type: number
                description: Danny fills this in; leave empty for a new image.
              - name: height
                label: Image height in pixels
                type: number
                description: Danny fills this in; leave empty for a new image.
              - name: alt
                label: Description for blind visitors
                type: text
                description: One or two sentences saying what the artwork looks like.

      # ---------- Research ----------
      - name: research
        label: Research
        type: object
        fields:
          - name: show
            label: Show Research
            type: boolean
          - name: heading
            label: Heading
            type: string
            description: Also used as the menu link at the top of the page.
          - name: title
            label: Project title
            type: string
            description: Shown in italics above the essay.
          - name: paragraphs
            label: Essay
            type: text
            list: true
            description: One box per paragraph.
          - name: italics
            label: Words in italics
            type: string
            list: true
            description: Titles to show in italics, written exactly as in the essay or the note.
          - name: note
            label: Note at the end
            type: text
            description: Shown in small type after the essay.
          - name: note_quote
            label: Quoted passage in the note
            type: text
            description: Shown indented under the note.

      # ---------- Projects ----------
      - name: projects
        label: Projects
        type: object
        fields:
          - name: show
            label: Show Projects
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: items
            label: Projects
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            description: Drag to change the order (oldest first reads as your work over time).
            fields:
              - name: title
                label: Project name
                type: string
              - name: detail
                label: Place and year
                type: string
                description: For example "Boston, 2025".
              - name: italic_title
                label: Show the name in italics (for books)
                type: boolean
              - name: link
                label: Link (optional)
                type: string
                description: A web address, or "#books" to jump to the Books section.
              - name: image
                label: Image
                type: image
                options:
                  media: images
              - name: width
                label: Image width in pixels
                type: number
                description: Danny fills this in; leave empty for a new image.
              - name: height
                label: Image height in pixels
                type: number
                description: Danny fills this in; leave empty for a new image.
              - name: alt
                label: Description for blind visitors
                type: text

      # ---------- Books ----------
      - name: books
        label: Books
        type: object
        fields:
          - name: show
            label: Show Books
            type: boolean
          - name: heading
            label: Heading
            type: string
            description: Also used as the menu link at the top of the page.
          - name: show_india_links
            label: Show India book links
            type: boolean
            description: Turns on the "Buy in India" buttons under each book.
          - name: items
            label: Books
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                description: Shown in italics.
              - name: subtitle
                label: Subtitle
                type: string
              - name: description
                label: One or two lines about the book
                type: text
              - name: cover
                label: Cover image
                type: image
                options:
                  media: images
                description: Leave empty to show a plain coloured cover with the title.
              - name: cover_width
                label: Cover width in pixels
                type: number
                description: Optional.
              - name: cover_height
                label: Cover height in pixels
                type: number
                description: Optional.
              - name: cover_alt
                label: Cover description for blind visitors
                type: string
              - name: links
                label: Buy links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Button text
                    type: string
                    description: For example "Buy on Amazon".
                  - name: url
                    label: Web address
                    type: string
              - name: india_links
                label: India buy links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                description: Shown only when "Show India book links" is ticked.
                fields:
                  - name: label
                    label: Button text
                    type: string
                    description: For example "Buy in India".
                  - name: url
                    label: Web address
                    type: string

      # ---------- Upcoming events ----------
      - name: events
        label: Upcoming events (book tour)
        type: object
        fields:
          - name: show
            label: Show tour dates
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: items
            label: Events
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} {city}"
            fields:
              - name: date
                label: Date
                type: string
                description: Written the way you want it shown, for example "14 November 2026".
              - name: city
                label: City
                type: string
              - name: venue
                label: Venue
                type: string
              - name: url
                label: Link (optional)
                type: string
              - name: link_label
                label: Link text
                type: string
                description: For example "Details" or "Tickets".

      # ---------- Panels ----------
      - name: panels
        label: Panels and conversations
        type: object
        fields:
          - name: show
            label: Show panels and conversations
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: items
            label: Panels
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Panel or event name
                type: string
              - name: with
                label: Speaking with
                type: string
                description: For example "Nilima Sheikh".
              - name: date
                label: Date
                type: string
              - name: place
                label: Place
                type: string
              - name: url
                label: Link (optional)
                type: string

      # ---------- Press ----------
      - name: press
        label: Press and quotes
        type: object
        fields:
          - name: show
            label: Show press quotes
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: items
            label: Quotes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{source}"
            fields:
              - name: quote
                label: Quote
                type: text
              - name: source
                label: Who said it
                type: string
                description: For example "The Hindu".
              - name: url
                label: Link to the article (optional)
                type: string

      # ---------- Talks and workshops ----------
      - name: talks
        label: Talks and workshops
        type: object
        fields:
          - name: show
            label: Show talks and workshops
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
            description: One or two lines.
          - name: link_label
            label: Link text
            type: string
            description: The link goes to the contact form.

      # ---------- Contact ----------
      - name: contact
        label: Contact
        type: object
        fields:
          - name: show
            label: Show Contact
            type: boolean
          - name: heading
            label: Heading
            type: string
            description: Also used as the menu link at the top of the page.
          - name: intro
            label: Line above the form (optional)
            type: text
          - name: email
            label: Your email address
            type: string
            description: Shown if the form can't be used.
          - name: form_key
            label: Contact form key (Web3Forms)
            type: string
            description: Danny sets this up. Leave it as it is.
          - name: instagram
            label: Instagram address
            type: string
          - name: linkedin
            label: LinkedIn address
            type: string
          - name: newsletter
            label: Newsletter
            type: object
            fields:
              - name: show
                label: Show the newsletter link
                type: boolean
              - name: text
                label: Line about the newsletter
                type: text
              - name: label
                label: Button text
                type: string
              - name: url
                label: Sign-up address
                type: string

      # ---------- Bottom of the page ----------
      - name: footer
        label: Bottom of the page
        type: object
        fields:
          - name: copyright
            label: Copyright line
            type: string
